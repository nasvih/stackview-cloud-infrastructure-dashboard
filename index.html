<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stackview — infrastructure and IT visibility</title>
<meta name="description" content="stackview is a demo application that shows one picture of everything a business runs and pays for: cloud and on-prem inventory, cost and waste, access, alerts and uptime.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0B70C8">
<script>
/* Theme before first paint: a stored choice wins, otherwise the operating
   system decides. Without this a dark browser flashes white while the
   module loads. No network, no dependencies. */
(function () {
  try {
    var p = JSON.parse(localStorage.getItem('stackview.prefs.v1') || '{}');
    var dark = p.theme ? p.theme === 'dark'
      : window.matchMedia && false;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141517');
  } catch (e) {}
})();
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stackview">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="./assets/stackview.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B70C8'/%3E%3Cpath d='M8 12h16M8 20h16' stroke='%23FFFFFF' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
</head>

  </div>
</noscript>

</body>
</html>
